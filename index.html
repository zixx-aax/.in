<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MK HTML Cloud (Permanent & Secure)</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff;}
.container{padding:15px;}
textarea{
  width:100%;height:250px;
  background:#020617;color:#0f0;padding:10px;
  border:1px solid #334155;
  border-radius:4px;
}
button{
  padding:10px 15px;margin:5px 5px 5px 0;
  background:#2563eb;color:white;border:none;
  cursor:pointer;
  border-radius:4px;
  font-weight:bold;
}
button:hover{background:#1d4ed8;}
iframe{
  width:100%;height:300px;margin-top:10px;background:white;
  border:1px solid #334155;
}
.card{
  background:#020617;
  padding:10px;margin-top:10px;
  border:1px solid #334155;
  cursor:pointer;
  border-radius:4px;
}
.card:hover{background:#1e293b;}
input{
  width:100%;
  padding:10px;
  margin-top:5px;
  background:#020617;
  color:#38bdf8;
  border:1px solid #334155;
  border-radius:4px;
}

/* Viewer Top Bar & Responsive Layout */
.viewer-bar {
  background: #1e293b;
  padding: 10px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #334155;
}
.view-btns button {
  background: #334155;
  margin: 0 3px;
  padding: 6px 12px;
  font-size: 13px;
}
.view-btns button.active {
  background: #2563eb;
}
.iframe-wrap {
  display: flex;
  justify-content: center;
  background: #020617;
  height: calc(100vh - 55px);
  transition: all 0.3s ease;
}
.iframe-wrap.desktop {
  width: 100%;
}
.iframe-wrap.mobile {
  width: 100%;
  padding: 20px 0;
}
.iframe-wrap.mobile iframe {
  width: 375px;
  height: 667px;
  border: 8px solid #334155;
  border-radius: 24px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}
.iframe-wrap.desktop iframe {
  width: 100%;
  height: 100%;
  border: none;
}
</style>
</head>

<body>

<div class="container" id="app">

<h2>⚡ Fast HTML Cloud Studio</h2>

<textarea id="code" placeholder="Write your HTML code here..."></textarea>

<br>

<button onclick="preview()">Preview</button>
<button onclick="saveLocal()">Save Local</button>
<button onclick="generate()">Generate Link</button>

<iframe id="previewFrame"></iframe>

<div id="linkBox"></div>

<h3>📁 History</h3>
<div id="historyList"></div>

</div>

<script>

// 🔴 PUT YOUR API KEY ONLY
const API_KEY = "$2a$10$8yhV85AJmo2nIR.wx9d2F.I6dTxt5NnpIKdZs9qqKWzB6ZAI9NUhG";

// HELPER: Ensure responsive viewport meta tag is present inside generated HTML
function injectViewport(html) {
  if (!/<meta\s+name=["']viewport["']/i.test(html)) {
    if (/<head>/i.test(html)) {
      return html.replace(/<head>/i, '<head>\n<meta name="viewport" content="width=device-width, initial-scale=1.0">');
    } else if (/<html>/i.test(html)) {
      return html.replace(/<html>/i, '<html>\n<head>\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n</head>');
    } else {
      return '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n' + html;
    }
  }
  return html;
}

// PREVIEW
function preview(){
  let code = document.getElementById("code").value;
  document.getElementById("previewFrame").srcdoc = injectViewport(code);
}

// SAVE LOCAL
function saveLocal(){
  let name = prompt("File name:");
  if(!name) return;

  let files = JSON.parse(localStorage.getItem("mk_files") || "{}");
  files[name] = document.getElementById("code").value;

  localStorage.setItem("mk_files", JSON.stringify(files));
  loadHistory();
}

// LOAD HISTORY
function loadHistory(){
  let files = JSON.parse(localStorage.getItem("mk_files") || "{}");
  let box = document.getElementById("historyList");

  box.innerHTML = "";

  for(let name in files){
    let div = document.createElement("div");
    div.className = "card";
    div.innerText = "📄 " + name;

    div.onclick = function(){
      document.getElementById("code").value = files[name];
      preview();
    }

    box.appendChild(div);
  }
}

// 🔥 GENERATE LINK
async function generate(){

  let html = document.getElementById("code").value;
  if(!html){ alert("Empty code!"); return; }

  let inputTime = prompt("Enter expire time in minutes, or type 'permanent':");
  if(!inputTime) return;

  let expireTime;

  if(inputTime.trim().toLowerCase() === "permanent" || inputTime.trim().toLowerCase() === "p"){
    let pass = prompt("Enter password for permanent link:");
    if(pass !== "L"){
      alert("❌ Incorrect password! Link creation cancelled.");
      return;
    }
    expireTime = null;
  } else {
    let minutes = parseFloat(inputTime);
    if(isNaN(minutes) || minutes <= 0){
      alert("Please enter a valid number of minutes or 'permanent'.");
      return;
    }
    expireTime = Date.now() + (minutes * 60000);
  }

  let data = {
    html: html,
    expire: expireTime
  };

  try{
    let res = await fetch("https://api.jsonbin.io/v3/b", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "X-Master-Key":API_KEY
      },
      body: JSON.stringify(data)
    });

    let json = await res.json();
    let binId = json.metadata.id;

    let link = location.origin + location.pathname + "?id=" + binId;

    document.getElementById("linkBox").innerHTML = `
      <p style="margin-top:10px; color:#38bdf8; font-size:14px;">🔗 Generated Link (${expireTime === null ? 'Permanent' : 'Temporary'}):</p>
      <input value="${link}" readonly onclick="this.select()">
    `;

  }catch(e){
    alert("Error: " + e.message);
  }
}

// 🔥 VIEW MODE WITH TOGGLE BAR FOR GITHUB PAGES
async function loadViewer(){

  let params = new URLSearchParams(location.search);
  let id = params.get("id");

  if(!id) return;

  try{

    let res = await fetch(`https://api.jsonbin.io/v3/b/${id}/latest`, {
      headers:{
        "X-Master-Key":API_KEY
      }
    });

    let json = await res.json();

    if(!json.record){
      document.body.innerHTML="<h2 style='text-align:center;margin-top:20vh;'>❌ Not Found</h2>";
      return;
    }

    let data = json.record;

    if(data.expire !== null && Date.now() > data.expire){
      document.body.innerHTML="<h2 style='text-align:center;margin-top:20vh;'>⛔ This link has expired.</h2>";
      return;
    }

    // BUILD VIEW PAGE WITH RESPONSIVE CONTROLS
    document.body.innerHTML = `
      <div class="viewer-bar">
        <span>⚡ MK Cloud Viewer</span>
        <div class="view-btns">
          <button id="desktopBtn" class="active" onclick="setViewMode('desktop')">💻 Desktop</button>
          <button id="mobileBtn" onclick="setViewMode('mobile')">📱 Mobile</button>
        </div>
      </div>
      <div id="iframeWrap" class="iframe-wrap desktop">
        <iframe id="cloudFrame"></iframe>
      </div>
    `;

    document.getElementById("cloudFrame").srcdoc = injectViewport(data.html);

  }catch(e){
    document.body.innerHTML="<h2 style='text-align:center;margin-top:20vh;'>⚠️ Error Loading Page</h2>";
  }
}

// TOGGLE VIEW MODE FUNCTION
function setViewMode(mode) {
  let wrap = document.getElementById("iframeWrap");
  let desktopBtn = document.getElementById("desktopBtn");
  let mobileBtn = document.getElementById("mobileBtn");

  if(mode === 'desktop'){
    wrap.className = "iframe-wrap desktop";
    desktopBtn.classList.add("active");
    mobileBtn.classList.remove("active");
  } else {
    wrap.className = "iframe-wrap mobile";
    mobileBtn.classList.add("active");
    desktopBtn.classList.remove("active");
  }
}

// INIT
loadHistory();
loadViewer();

</script>

</body>
</html>
